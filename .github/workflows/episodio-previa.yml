name: Episódio — prévia

# Roda quando alguém abre (ou edita) uma Issue do formulário "Enviar episódio". NÃO tem acesso às credenciais do
# Internet Archive: só baixa, trata, transcreve e comenta a prévia. O corpo da Issue é texto não confiável e chega por
# variável de ambiente (nunca interpolado no script).
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: previa-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  previa:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'enviar-episodio')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -r pipeline/requirements.txt faster-whisper "av<17" pyyaml
      - name: Cache do modelo de transcrição
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Gerar a prévia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python pipeline/ci/preview.py
      - name: Guardar o áudio tratado e os metadados (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previa-issue-${{ github.event.issue.number }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
