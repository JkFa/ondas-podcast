name: Episódio — publicar

# Roda quando alguém com permissão de escrita aplica o rótulo `aprovado` numa Issue "Enviar episódio".
# Antes de publicar confere: (1) quem aprovou tem permissão, (2) a Issue não mudou desde a prévia (hash do pedido),
# (3) usa os metadados aprovados (os da prévia, ou os ajustados por /metadados de quem mantém o projeto).
# As credenciais do Internet Archive ficam só aqui, como secrets do repositório.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: publicar-episodio
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event.label.name == 'aprovado' && contains(github.event.issue.labels.*.name, 'enviar-episodio')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -r pipeline/requirements.txt faster-whisper "av<17" pyyaml
      - name: Cache do modelo de transcrição
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Conferir a aprovação e publicar no Internet Archive
        id: pub
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SENDER: ${{ github.event.sender.login }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python pipeline/ci/publish_approved.py
      - name: Gravar no catálogo e publicar o site
        if: steps.pub.outputs.published == 'true'
        env:
          EPISODE_TITLE: ${{ steps.pub.outputs.title }}
        run: |
          git config user.name "ondas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/catalog.json
          git commit -m "feat: novo episódio pela Issue #${ISSUE_NUMBER}: ${EPISODE_TITLE}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          # Commits feitos com o GITHUB_TOKEN não disparam outros workflows: chama o deploy de propósito.
          gh workflow run deploy.yml --ref main
      - name: Avisar na Issue (publicado)
        if: steps.pub.outputs.published == 'true'
        run: python pipeline/ci/finish.py success
      - name: Avisar na Issue (falhou)
        if: failure()
        env:
          REASON: ${{ steps.pub.outputs.reason }}
        run: python pipeline/ci/finish.py failure
      - name: Guardar logs e arquivos (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publicacao-issue-${{ github.event.issue.number }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
