name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Contraste das paletas (WCAG AA)
        run: npm run test:contrast
      - name: Build (sem o feed, que consulta o archive.org)
        run: npm run build:fast
      - name: Navegador para os testes de acessibilidade
        run: npx playwright install --with-deps chromium
      - name: axe-core + teclado + player (WCAG 2.2 AA)
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 2>/dev/null || sleep 5
          BASE_URL=http://localhost:4173/ npm run test:a11y
      - name: Transcrições (sincronia, busca, legenda, downloads, link)
        run: |
          npx vite preview --port 4175 &
          sleep 4
          BASE_URL=http://localhost:4175/ npm run test:transcripts
      - name: Compartilhamento (redes, Web Share, Stories, link com ponto, prévias, incorporar)
        run: |
          npx vite preview --port 4176 &
          sleep 4
          BASE_URL=http://localhost:4176/ npm run test:share
      - name: Assinar no app (esquemas, plano B, feeds por obra, QR)
        run: |
          npx vite preview --port 4178 &
          sleep 4
          BASE_URL=http://localhost:4178/ npm run test:subscribe
      - name: Ouvir sem internet (service worker, downloads, modo avião, Range)
        run: |
          npx vite preview --port 4177 &
          sleep 4
          BASE_URL=http://localhost:4177/ npm run test:offline
      - name: Lighthouse (acessibilidade ≥ 95)
        run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: web/.lighthouseci

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Testes do pipeline (funções puras, sem baixar modelos)
        run: python -m pytest pipeline/tests -q
