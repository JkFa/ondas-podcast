name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Contraste das paletas (WCAG AA)
        run: npm run test:contrast
      - name: Build (sem o feed, que consulta o archive.org)
        run: npm run build:fast
      - name: Navegador para os testes de acessibilidade
        run: npx playwright install --with-deps chromium
      - name: axe-core + teclado + player (WCAG 2.2 AA)
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 2>/dev/null || sleep 5
          BASE_URL=http://localhost:4173/ npm run test:a11y
      - name: Lighthouse (acessibilidade ≥ 95)
        run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: web/.lighthouseci
