    <script>
      // Aplica as preferências de acessibilidade antes do primeiro desenho (evita piscar o tema errado).
      try {
        var p = JSON.parse(localStorage.getItem('ondas:v1:a11y') || '{}'), r = document.documentElement;
        var light = p.theme === 'light' || (p.theme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        r.dataset.theme = light ? 'light' : 'dark';
        r.dataset.contrast = p.contrast ? 'high' : 'normal';
        if (p.textScale) r.style.fontSize = p.textScale + '%';
      } catch (e) {}
    </script>
    <title>Ondas — áudios e podcasts indies</title>
