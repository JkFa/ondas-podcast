<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ondas — player</title>
<style>
  :root { color-scheme: light dark; --bg: #0b0b14; --fg: #f6f6fc; --muted: #b9b9d2; --accent: #c6f432; --line: #4a4a66 }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f6fc; --fg: #0b0b14; --muted: #3c3c55; --accent: #3d6600; --line: #6a6a88 } }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif }
  .card { display: flex; gap: 14px; align-items: center; padding: 12px; min-height: 100vh }
  img { width: 96px; height: 96px; border-radius: 14px; object-fit: cover; flex: none; background: #1d1d31 }
  .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px }
  h1 { font-size: 1rem; line-height: 1.2; margin: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
  p { margin: 0; color: var(--muted); font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  audio { width: 100%; height: 40px }
  a { color: var(--accent); font-size: .8125rem; font-weight: 600; min-height: 24px }
  a:focus-visible, audio:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px }
  .msg { padding: 16px; color: var(--muted) }
  @media (max-width: 380px) { img { width: 64px; height: 64px } }
</style>
</head>
<body>
<main id="root" class="msg" role="status">Carregando…</main>
<script>
// Player incorporável do Ondas. Uso: <iframe src=".../embed/?ep=<id-do-episódio>[&t=segundos]">
// Leve de propósito (sem React): lê ../catalog.json, mostra capa, título e o <audio controls> nativo (já acessível).
(function () {
  var root = document.getElementById('root');
  var q = new URLSearchParams(location.search);
  var id = q.get('ep');
  var start = Math.max(0, parseInt(q.get('t') || '0', 10) || 0);
  var base = new URL('../', location.href);
  function msg(t) { root.className = 'msg'; root.textContent = t; }
  if (!id) return msg('Falta o episódio (parâmetro ep).');
  fetch(new URL('catalog.json', base)).then(function (r) { return r.json(); }).then(function (data) {
    var ep = (data.episodes || []).filter(function (e) { return e.id === id; })[0];
    if (!ep) return msg('Episódio não encontrado.');
    var author = (ep.show || '').replace(/^LibriVox\s*·\s*/i, '');
    var page = new URL('episodio/' + encodeURIComponent(ep.id) + '/', base).href;
    root.className = 'card';
    root.removeAttribute('role');
    root.innerHTML = '';
    if (ep.cover) {
      var img = document.createElement('img');
      img.src = ep.cover; img.alt = 'Capa de ' + (ep.series || ep.title) + ', de ' + author; img.loading = 'lazy';
      root.appendChild(img);
    }
    var body = document.createElement('div'); body.className = 'body';
    var h = document.createElement('h1'); h.textContent = ep.title; body.appendChild(h);
    var p = document.createElement('p'); p.textContent = author; body.appendChild(p);
    var a = document.createElement('audio');
    a.controls = true; a.preload = 'metadata'; a.src = ep.audioUrl;
    a.setAttribute('aria-label', 'Player: ' + ep.title);
    if (start) a.addEventListener('loadedmetadata', function () { if (start < a.duration) a.currentTime = start; }, { once: true });
    body.appendChild(a);
    var link = document.createElement('a'); link.href = page; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = 'Ouvir no Ondas'; body.appendChild(link);
    root.appendChild(body);
    document.title = 'Ondas — ' + ep.title;
  }).catch(function () { msg('Não foi possível carregar o player.'); });
})();
</script>
</body>
</html>
